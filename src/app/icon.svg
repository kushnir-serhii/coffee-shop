<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Meridian">
  <defs>
    <linearGradient id="bean" x1="17" y1="11" x2="47" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B4532A"/>
      <stop offset="0.55" stop-color="#8E3F1F"/>
      <stop offset="1" stop-color="#57290F"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#FAF8F5"/>

  <g transform="rotate(-38 32 32)">
    <!-- bean body -->
    <ellipse cx="32" cy="32" rx="15.4" ry="22" fill="url(#bean)"/>
    <!-- centre crease: a gentle S, wide enough to survive 16px rasterisation
         but not so wide that it cuts the bean in half -->
    <path d="M32 11 C27 18.5, 37 26, 32 32 C27 38, 37 45.5, 32 53"
          fill="none" stroke="#FAF8F5" stroke-width="3.6" stroke-linecap="round"/>
    <!-- soft highlight along the upper-left edge -->
    <path d="M22 21 C19 26, 18.4 32, 19.6 38"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.26"
          stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
